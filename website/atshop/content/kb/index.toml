# The AT SUITE knowledge base: the help centre at /docs on the website, the manual inside the app
# (/guide/manual) and what the AI helper answers "how do I..." questions from.
#
# Sections and their articles, in reading order. Each article is <slug>.md in this folder.
# Pictures are in website/atshop/static/kb/ (python website/tools/kb_screenshots.py retakes them).
#
# version: the AT SUITE release these pages describe. Every release updates the pages for what
# changed, then sets this to the new VERSION; CI fails while it's behind (see CONTRIBUTING.md).
version = "1.25.3"

