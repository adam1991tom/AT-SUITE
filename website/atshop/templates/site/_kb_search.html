<form class="kb-search" action="/docs/search" method="get" role="search">
  <label for="kb-q">Search the help centre</label>
  <div class="kb-search-row">
    <input type="search" id="kb-q" name="q" value="{{ q or '' }}" placeholder="For example: add a screen, captions, licence" autocomplete="off">
    <button class="btn primary" type="submit">Search</button>
  </div>
</form>
